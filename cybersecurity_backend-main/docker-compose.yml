version: '3.8'

services:
  # MongoDB Database
  db:
    image: mongo:7.0
    container_name: pentestlab-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: pentestlab
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pentestlab-network

  # FastAPI Backend Application
  api:
    build: .
    container_name: pentestlab-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - scan_results:/app/scan_results
      - logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - MONGODB_URL=mongodb://admin:admin123@db:27017
      - DATABASE_NAME=pentestlab
      - SECRET_KEY=change-this-super-secret-key-in-production-minimum-32-characters-long
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pentestlab-network

  # Optional: Mongo Express for database management
  mongo-express:
    image: mongo-express:latest
    container_name: pentestlab-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@db:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "8081:8081"
    depends_on:
      - db
    networks:
      - pentestlab-network
    profiles:
      - dev

networks:
  pentestlab-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
  scan_results:
  logs:
